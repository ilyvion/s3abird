server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The srcdoc email frames inherit this policy, so it must allow every source their own policy allows.
    # A location block with its own add_header does not inherit this header.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; font-src data: https:; img-src 'self' data: https:; media-src data: https:; connect-src https://*.amazonaws.com; form-action 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA fallback: serve index.html for any path that doesn't match a real file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
