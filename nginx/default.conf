# An empty value makes add_header send nothing, so only 404s get this header.
# Caddy adds a year-long Cache-Control to static file extensions unless the upstream sends one.
map $status $not_found_cache_control {
    404     "no-cache";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The srcdoc email frames inherit this policy, so it must allow every source their own policy allows.
    # A location block with its own add_header does not inherit these headers.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; font-src data: https:; img-src 'self' data: https:; media-src data: https:; connect-src https://*.amazonaws.com; form-action 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $not_found_cache_control always;

    # Missing static files return 404 instead of the SPA fallback.
    # Matched by extension because client route ids may contain dots.
    location ~* \.(?:css|js|png|jpg|jpeg|svg|ico|woff2)$ {
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any path that doesn't match a real file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
